git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
gui:
  nerdFontsVersion: "3"
os:
  editTemplate: "nvim --server /tmp/nvim-server.pipe --remote-tab {{filename}}"
  editAtLineTemplate: "nvim +{{line}} --server /tmp/nvim-server.pipe --remote-tab {{filename}}"
  editInTerminal: true
